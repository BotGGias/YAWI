#  Build- und Test-Matrix ueber die drei Betriebssysteme.
#
# HINWEIS: Diese Datei ist Konfiguration und wurde NICHT auf echten GitHub-Runnern
# verifiziert (lokal steht nur Linux zur Verfuegung). Sie baut je OS die Tests und
# das portable App-Image-Archiv (-Pdist) und laedt die Artefakte hoch. JavaFX kommt
# als Maven-Abhaengigkeit, deshalb genuegt ein normales Temurin-JDK 21 (jpackage und
# jlink liegen darin); die nativen .msi/.deb/.dmg sind hier noch nicht
# gebaut. Der Freigabe-Build (-Pdist,release verify, Signatur-Guard + Pruefsummen,
#  laeuft erst mit einem echten Release-Signaturschluessel.
name: build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git-commit-id-maven-plugin: Commit/Tag verfuegbar (E16-S03-T03)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tests
        shell: bash
        run: ./mvnw -B test

      - name: Portables Archiv (App-Image)
        shell: bash
        run: ./mvnw -B -Pdist -DskipTests package

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: yawi-installer-${{ matrix.os }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.zip
            target/dist/*.sha256
          if-no-files-found: error
