# Filtered by Maven (pom.xml, resource with filtering=true). The installer's own
# build coordinates - distinct from the installed product's version, which comes
# from the manifest (product/@version). git.* are supplied by the
# git-commit-id-maven-plugin; empty outside a git checkout.
app.version=${project.version}
build.commit=${git.commit.id.abbrev}
build.time=${git.build.time}
