# Silent mode (E15): help text, progress lines, result
cli.help.usage=Usage: yawi-installer [options]
cli.help.intro=Without options the graphical setup wizard starts. With --silent the installation runs without a window; every option is --name or --name=value.
cli.help.silent=--silent                 run without a window
cli.help.update=--update                 bring the installation in --dest up to date (components and settings from its record; only with --silent)
cli.help.repair=--repair                 reinstall the installation in --dest from its record (only with --silent)
cli.help.uninstall=--uninstall              remove the installation in --dest (from its record; only with --silent)
cli.help.purge=--purge                  with --uninstall: also delete changed files and everything else in --dest
cli.help.manifest=--manifest=<file|url>    manifest to use; default: installer.xml next to the application, else the built-in one
cli.help.config=--config=<file>          answer file (language, destination, components, sources, inputs, license); arguments override it
cli.help.dest=--dest=<folder>           destination folder; default: the manifest's folder for this system
cli.help.allUsers=--all-users              use the system-wide default folder (may need administrator rights)
cli.help.components=--components=a,b,c       components to install; default: the manifest's typical selection
cli.help.input=--input.<id>=<value>     value of a component setting; default: the manifest's default value
cli.help.lang=--lang=<code>            language of the messages, e.g. de or en
cli.help.acceptLicense=--accept-license         accept the license agreement (required when the manifest has one)
cli.help.cache=--cache=<folder>          take files listed in <folder>/SHA256SUMS from there after checking them, download only the rest
cli.help.waitPid=--wait-pid=<pid>          wait for this process to end before writing (repeatable, at most 60 seconds)
cli.help.relaunch=--relaunch                start the installed application afterwards
cli.help.result=--result=<file>           write a JSON result file with exit code, version and message
cli.help.log=--log=<file>              write the log to this file
cli.help.dryRun=--dry-run                show what would be done without changing anything
cli.help.quiet=--quiet                  print errors only
cli.help.output=--output=text|json       progress as text lines (default) or one JSON object per event
cli.help.help=--help                   show this overview
